name = "ats-jobs-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = true

# No secrets are required.
# Optional: set PROXY_SECRET with `wrangler secret put PROXY_SECRET` to require the
# X-RapidAPI-Proxy-Secret header that RapidAPI adds to every proxied call.
# When PROXY_SECRET is unset the header is not checked.

[vars]
# Edge cache TTL in seconds for normalized board data.
CACHE_TTL_SECONDS = "600"
